plugins { id 'com.android.application' }

android {
    namespace 'dev.s25.farmer'
    compileSdk 35
    defaultConfig {
        applicationId 'dev.s25.farmer'
        minSdk 34
        targetSdk 35
        versionCode 3
        versionName '0.3.0-device-test'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures { buildConfig true }
    signingConfigs {
        localRelease {
            def key = rootProject.file('signing/farmer.jks')
            def password = rootProject.file('signing/password.txt')
            if (key.exists() && password.exists()) {
                storeFile key
                storePassword password.text.trim()
                keyAlias 'dragon-farmer'
                keyPassword password.text.trim()
            }
        }
    }
    buildTypes {
        debug { debuggable true }
        release { minifyEnabled false; signingConfig signingConfigs.localRelease }
    }
    packaging { jniLibs { useLegacyPackaging = false } }
    testOptions { unitTests.returnDefaultValues = true }
}

dependencies {
    // The OCR model is packaged inside the APK. No model download/runtime app.
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
